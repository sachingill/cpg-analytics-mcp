<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 480" width="1340" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>cpg-analytics-mcp architecture</title>
  <desc>An LLM client talks to the MCP server over stdio JSON-RPC. Every tool call passes a role policy, then either the governed semantic layer (preferred) or sqlglot SQL guardrails (fallback), then a read-only warehouse adapter. Every call is written to an audit log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
    <style>
      .box   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .sub   { font-size: 12px; fill: #57606a; }
      .label { font-size: 12px; fill: #57606a; }
      .edge  { stroke: #57606a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- canvas: solid background so it reads in light and dark GitHub themes -->
  <rect x="0" y="0" width="1340" height="480" rx="12" fill="#f6f8fa"/>

  <!-- user + client -->
  <rect class="box" x="20" y="196" width="110" height="64" rx="10"/>
  <text class="title" x="75" y="225" text-anchor="middle">User</text>
  <text class="sub" x="75" y="243" text-anchor="middle">business question</text>

  <rect x="160" y="186" width="150" height="84" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text class="title" x="235" y="220" text-anchor="middle">LLM / MCP client</text>
  <text class="sub" x="235" y="239" text-anchor="middle">picks tool + arguments</text>
  <text class="sub" x="235" y="255" text-anchor="middle">from tool descriptions</text>

  <path class="edge" d="M130,228 L158,228" marker-end="url(#arrow)"/>

  <!-- server container -->
  <rect x="370" y="20" width="760" height="440" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="title" x="390" y="46">cpg-analytics MCP server</text>
  <text class="sub" x="390" y="64">deterministic: every rule and number comes from here, not from the model</text>

  <!-- client <-> server -->
  <path class="edge" d="M310,228 L393,228" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="label" x="339" y="218" text-anchor="middle">stdio</text>
  <text class="label" x="339" y="246" text-anchor="middle">JSON-RPC</text>

  <!-- tools -->
  <rect class="box" x="395" y="186" width="150" height="84" rx="10"/>
  <text class="title" x="470" y="218" text-anchor="middle">MCP interface</text>
  <text class="sub" x="470" y="238" text-anchor="middle">6 tools · 1 resource</text>
  <text class="sub" x="470" y="254" text-anchor="middle">2 workflow prompts</text>

  <!-- role policy -->
  <rect class="box" x="575" y="186" width="145" height="84" rx="10"/>
  <text class="title" x="647" y="218" text-anchor="middle">Role policy</text>
  <text class="sub" x="647" y="238" text-anchor="middle">roles.yaml</text>
  <text class="sub" x="647" y="254" text-anchor="middle">analyst · sales · finance</text>

  <path class="edge" d="M545,228 L573,228" marker-end="url(#arrow)"/>

  <!-- metric path -->
  <rect x="760" y="92" width="200" height="84" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text class="title" x="860" y="122" text-anchor="middle">Semantic layer</text>
  <text class="sub" x="860" y="142" text-anchor="middle">metrics.yaml: one formula per KPI</text>
  <text class="sub" x="860" y="158" text-anchor="middle">allowlisted names · bound values</text>
  <path d="M720,212 C742,212 740,134 758,134" stroke="#1a7f37" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <text x="748" y="86" font-size="12" font-weight="600" fill="#1a7f37">get_metric (preferred)</text>

  <!-- sql path -->
  <rect x="760" y="282" width="200" height="84" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text class="title" x="860" y="312" text-anchor="middle">SQL guardrails</text>
  <text class="sub" x="860" y="332" text-anchor="middle">sqlglot AST: one SELECT only</text>
  <text class="sub" x="860" y="348" text-anchor="middle">no writes/files · blocked columns</text>
  <path d="M720,244 C742,244 740,324 758,324" stroke="#9a6700" stroke-width="1.8" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="772" y="386" font-size="12" font-weight="600" fill="#9a6700">run_sql (ad-hoc fallback)</text>

  <!-- warehouse adapter -->
  <rect class="box" x="990" y="186" width="120" height="84" rx="10"/>
  <text class="title" x="1050" y="214" text-anchor="middle">Warehouse</text>
  <text class="title" x="1050" y="232" text-anchor="middle">adapter</text>
  <text class="sub" x="1050" y="254" text-anchor="middle">row cap · timeout</text>
  <path class="edge" d="M960,134 C978,134 978,212 988,212" marker-end="url(#arrow)"/>
  <path class="edge" d="M960,324 C978,324 978,244 988,244" marker-end="url(#arrow)"/>

  <!-- audit log -->
  <rect class="box" x="395" y="372" width="150" height="64" rx="10"/>
  <text class="title" x="470" y="400" text-anchor="middle">Audit log</text>
  <text class="sub" x="470" y="418" text-anchor="middle">JSONL · every call</text>
  <path class="edge" d="M470,270 L470,370" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="325">role · args · status · ms</text>

  <!-- database (cylinder) -->
  <path d="M1170,196 L1170,276 A70,14 0 0 0 1310,276 L1310,196" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
  <ellipse cx="1240" cy="196" rx="70" ry="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text class="title" x="1240" y="232" text-anchor="middle">DuckDB</text>
  <text class="sub" x="1240" y="250" text-anchor="middle">read-only</text>
  <text class="sub" x="1240" y="266" text-anchor="middle">no external access</text>
  <text class="sub" x="1240" y="312" text-anchor="middle">next: Snowflake /</text>
  <text class="sub" x="1240" y="328" text-anchor="middle">Databricks</text>
  <path class="edge" d="M1110,228 L1166,228" marker-end="url(#arrow)"/>
</svg>
