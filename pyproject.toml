[project]
name = "cpg-analytics-mcp"
version = "0.1.0"
description = "Production-grade MCP server for governed CPG commercial analytics (promo ROI, sell-out, ship attainment)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
]

[project.scripts]
cpg-analytics-mcp = "cpg_analytics_mcp.server:main"
cpg-mcp-generate = "cpg_analytics_mcp.data.generate:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and unused names · I: import order · UP: modern syntax · B: likely bugs
select = ["E", "F", "I", "UP", "B"]
